<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>파이프라인 설계</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
<style>
  /* 단계 흐름 */
  .flow{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative}
  .stage{position:relative;padding:0 14px}
  .stage+.stage{border-left:1px dashed var(--grid)}
  .stage .no{font-size:12px;font-weight:700;color:var(--accent)}
  .stage h3{margin:2px 0 4px;font-size:15px}
  .stage .what{font-size:12.5px;color:var(--ink2);min-height:38px}
  .stage ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
  .stage li{font-size:12.5px;padding:7px 10px;border-radius:8px;background:var(--page);border:1px solid var(--border);display:flex;gap:7px;align-items:baseline}
  .stage li code{font-size:11.5px}
  .stage .arrow{position:absolute;right:-9px;top:4px;color:var(--muted);font-size:14px;background:var(--surface);z-index:1}
  .orch{margin-top:16px;padding:10px 14px;border-radius:10px;background:var(--hl);font-size:13px;color:var(--ink2);text-align:center}
  /* 상태 표시 (아이콘 + 글자) */
  .s{flex:none;font-size:11px;font-weight:700;white-space:nowrap}
  .s.ok{color:var(--good-ink)} .s.plan{color:var(--muted)} .s.go{color:var(--accent)}
  .legend2{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
  code{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12.5px;background:var(--track);padding:1px 5px;border-radius:4px}
  /* 표 */
  .tbl2{width:100%;border-collapse:collapse;font-size:13px}
  .tbl2 th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--grid)}
  .tbl2 td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
  .tbl2 tr:last-child td{border-bottom:0}
  .tbl2 td:first-child{font-weight:600;white-space:nowrap}
  .scroll{overflow-x:auto}
  /* 리니지 */
  .lin{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .lin .col h4{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.02em}
  .lin .m{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:11.5px;padding:6px 8px;border-radius:7px;border:1px solid var(--border);background:var(--page);margin-bottom:6px;overflow-wrap:anywhere}
  .lin .m.star{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));font-weight:700}
  .lin .m small{display:block;font-family:inherit;color:var(--muted);font-weight:400}
  /* 관문 · DAG */
  .gates{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .gate{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--page)}
  .gate b{display:block;font-size:12px;color:var(--accent)}
  .gate .n{font-weight:700;font-size:14px;margin:2px 0 6px}
  .gate p{margin:0;font-size:12px;color:var(--ink2)}
  .gate .f{margin-top:8px;font-size:11.5px;color:var(--muted)}
  .dag{display:flex;flex-direction:column;align-items:flex-start;gap:0;font-size:13px}
  .dag .t{padding:8px 12px;border:1px solid var(--border);border-radius:9px;background:var(--page);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .dag .t code{background:none;padding:0;font-weight:700;font-size:12.5px}
  .dag .t span{color:var(--muted);font-size:12px}
  .dag .t.group{border-color:var(--accent)}
  .dag .dn{color:var(--muted);padding:2px 0 2px 18px;font-size:12px}
  .note{font-size:12.5px;color:var(--ink2);margin-top:14px;padding-left:12px;border-left:3px solid var(--grid)}
  .principle{font-size:14px;color:var(--ink);margin:16px 0 0;padding:12px 16px;border-radius:10px;background:var(--page);border:1px solid var(--border)}
  @media (max-width:980px){
    .flow{grid-template-columns:1fr;gap:16px}
    .stage+.stage{border-left:0;border-top:1px dashed var(--grid);padding-top:16px}
    .stage .arrow{display:none}.stage .what{min-height:0}
    .lin{grid-template-columns:1fr 1fr}.gates{grid-template-columns:1fr 1fr}
  }
  @media (max-width:600px){main{padding:24px 16px 60px}.lin,.gates{grid-template-columns:1fr}.card{padding:18px 16px}}
  .lock-card{max-width:440px;margin:24px auto;text-align:center;padding:36px 28px 28px}
  .lock-ic{font-size:28px}
  .lock-card h2{font-size:18px;margin:8px 0 4px}
  #lock-form{display:flex;gap:8px;justify-content:center}
  #lock-pw{width:170px;font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--ink);text-align:center;letter-spacing:.2em}
  #lock-pw::placeholder{letter-spacing:0}
  #lock-msg{min-height:20px;margin-top:10px;font-size:13px;color:var(--crit)}
</style>
</head>

<script>
(() => {
  const P = JSON.parse(document.getElementById('lock-data').textContent);
  const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function open(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.iv) }, key, u8(P.ct));
    document.getElementById('locked').outerHTML = new TextDecoder().decode(pt);
    sessionStorage.setItem('msl-pw', pw);
  }
  const msg = document.getElementById('lock-msg');
  document.getElementById('lock-form').onsubmit = async e => {
    e.preventDefault(); msg.textContent = '확인 중…';
    try { await open(document.getElementById('lock-pw').value); }
    catch { msg.textContent = '비밀번호가 맞지 않아요'; }
  };
  let saved = null; try { saved = sessionStorage.getItem('msl-pw'); } catch {}
  if (saved) open(saved).catch(() => { try { sessionStorage.removeItem('msl-pw'); } catch {} });
})();
</script>
</main>
<script>initTheme(document.getElementById('theme'));</script>
